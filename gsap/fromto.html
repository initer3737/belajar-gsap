<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <style>
    body { background: #111; display: grid; place-content: center; height: 100vh; gap: 20px; }
    .box { width: 80px; height: 80px; }
    .box1 { background: #e74c3c; }
    .box2 { background: #3498db; }
    .box3 { background: #2ecc71; }
  </style>
</head>
<body>
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
  <script>
    // Animasi GSAP
    gsap.set('.box1', { duration: 2, x: 500, repeat: -1, yoyo: true });
    gsap.to('.box1', { duration: 2, x: 100, repeat: -1, yoyo: true });
    gsap.fromTo('.box2', { duration: 2, opacity: 0, scale: 1.5, delay: 0.5 },{ duration: 2, opacity:1, scale: 1.5, delay: 0 });
    gsap.to('.box3', { duration: 2, rotation: 360, repeat: -1, ease: "none" });
  </script>
</body>

</body>
</html>
